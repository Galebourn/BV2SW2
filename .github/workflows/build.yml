name: Build Switch 2 NRO
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Import pinned upstream and apply port
        if: ${{ hashFiles('CMakeLists.txt') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blobby-import"
          curl -fL https://github.com/danielknobe/blobbyvolley2/archive/c28c5fa87872b7592f34f5f86196e93d127b6cf9.tar.gz | tar -xz --strip-components=1 -C "$RUNNER_TEMP/blobby-import"
          cd "$RUNNER_TEMP/blobby-import"
          git apply "$GITHUB_WORKSPACE/switch2-port.patch"
          rsync -a --exclude=.github/ --exclude=README.md ./ "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Import upstream game source and apply Switch 2 port"
          git push
      - name: Test menu navigation filtering
        shell: bash
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Isrc test/menu_navigation.cpp -o /tmp/menu-navigation-test
          /tmp/menu-navigation-test
          g++ -std=c++11 -Wall -Wextra -Werror -Isrc test/spatial_menu.cpp -o /tmp/spatial-menu-test
          /tmp/spatial-menu-test
      - name: Test menu interactions and render previews
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsdl2-dev libphysfs-dev libboost-dev ninja-build python3-pil
          cmake -S . -B build-ui -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_MENU_UI_TEST=ON -DCMAKE_CXX_FLAGS=-DBLOBBY_MODERN_UI -DCMAKE_DISABLE_FIND_PACKAGE_OpenGL=TRUE
          cmake --build build-ui --target menu-ui-smoke --parallel 4
          mkdir -p /tmp/bv2-menu-test
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./build-ui/src/menu-ui-smoke
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          for p in Path('/tmp/bv2-menu-test').glob('*.bmp'):
              Image.open(p).save(p.with_suffix('.png'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menu-previews
          path: /tmp/bv2-menu-test/*.png

      - name: Build NRO and game data
        shell: bash
        run: docker build --progress=plain --file switch2/Dockerfile --output type=local,dest=dist . 2>&1 | tee build.log
      - name: Check NRO and assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dist/switch/blobby2/blobby.nro')
          assert p.read_bytes()[16:20] == b'NRO0'
          assert Path('dist/switch/blobby2/data/gfx.zip').is_file()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: blobby-volley-2-kaihen-experimental
          path: dist/
          if-no-files-found: error
